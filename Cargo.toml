[package]
name = "paddock-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["default_app", "std", "bevy_winit", "default_font", "multi_threaded", "x11", "wayland", "2d_bevy_render", "3d_bevy_render", "bevy_picking", "ui_picking", "ui_api", "ui_bevy_render"] }
cpal = "0.18.2"
evdev = "0.13"
nix = { version = "0.29", features = ["term", "fs"] }

# Recommended by Bevy: light optimization for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
